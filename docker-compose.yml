version: '3.8'
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - mock-api
    environment:
      # Browser needs to hit the API, so we use localhost:3001
      - VITE_API_BASE_URL=http://localhost:3001

  mock-api:
    image: node:18-alpine
    working_dir: /app
    command: sh -c "npm install -g json-server && json-server --watch db.json --host 0.0.0.0 --port 3001"
    volumes:
      - ./db.json:/app/db.json
    ports:
      - "3001:3001"
